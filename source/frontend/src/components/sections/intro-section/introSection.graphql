fragment IntroSectionFragment on IntroSection {
  _key
  _type
  title
  blocks {
    ... on IntroTextBlock {
      _key
      _type
      text
    }
    ... on IntroIconBlock {
      _key
      _type
      iconType
    }
  }
  content
  subtitle
  cta {
    label
    url
  }
  enabled
}

query IntroSectionData {
  allIntroSection {
    _id
    ...IntroSectionFragment
  }
}
